<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://apis.google.com; style-src 'self'; font-src 'self'; img-src 'self' blob: https://upload.wikimedia.org https://thumb.wikimedia.org https://res.cloudinary.com; connect-src 'self' https://upload.wikimedia.org https://thumb.wikimedia.org https://res.cloudinary.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com wss://*.googleapis.com https://apis.google.com https://accounts.google.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; form-action 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0d0d0d"><meta name="glauco-release" content="1.4.0">
<meta name="application-name" content="Glauco"><meta name="apple-mobile-web-app-title" content="Glauco"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Glauco · Your personal guide</title>
<link rel="manifest" href="manifest.webmanifest?v=1.4.0"><link rel="icon" type="image/png" sizes="930x930" href="app-icon.png?v=1.4.0"><link rel="apple-touch-icon" href="app-icon.png?v=1.4.0">
<link rel="stylesheet" href="styles.css?v=1.4.0"><link rel="stylesheet" href="explorer.css?v=1.4.0"><link rel="stylesheet" href="motion.css?v=1.4.0"><script type="module" src="app.js?v=1.4.0"></script>
</head>
<body>
<header class="top-header">
<div id="tripSelector" class="trip-selector hidden"><label for="tripSelect" class="sr-only">Selected trip</label><select id="tripSelect" aria-label="Selected trip"><option value="">No trips yet</option></select></div>
<nav class="main-nav" aria-label="Primary navigation">
<a class="nav-tab" href="#/trip" data-tab="trip"><svg class="nav-icon" viewBox="0 0 21 21" aria-hidden="true"><use class="icon-outline" href="icons.svg#trip-outline"/><use class="icon-selected" href="icons.svg#trip-selected"/></svg><span>Trip</span></a>
<a class="nav-tab" href="#/customs" data-tab="customs"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><use class="icon-outline" href="icons.svg#customs-outline"/><use class="icon-selected" href="icons.svg#customs-selected"/></svg><span>Customs</span></a>
<a class="nav-tab" href="#/settings" data-tab="settings"><svg class="nav-icon" viewBox="0 0 20 21" aria-hidden="true"><use class="icon-outline" href="icons.svg#settings-outline"/><use class="icon-selected" href="icons.svg#settings-selected"/></svg><span>Settings</span></a>
</nav><span id="connection" class="connection" role="status">Starting…</span>
</header>
<aside id="releaseBanner" class="banner hidden" aria-live="polite"><span>A new version of Glauco is ready.</span><button id="updateApp" class="button small">Update</button></aside>
<aside id="installBanner" class="banner hidden"><span>Keep your guide close. Install Glauco.</span><button id="installApp" class="button small">Install</button><button id="dismissInstall" class="icon-button" aria-label="Dismiss install prompt">×</button></aside>
<main id="main" class="app" tabindex="-1"><div class="empty"><h1>Opening your guide…</h1></div></main>
<a id="todayShortcut" class="today-shortcut hidden" href="#/trip" aria-label="Open today’s day details"></a>
<p id="notice" class="toast hidden" role="status" aria-live="polite"></p>
<dialog id="importDialog" aria-labelledby="importTitle"><form method="dialog" class="dialog-inner"><div class="dialog-heading"><div><p class="eyebrow">YOUR GUIDEBOOK</p><h2 id="importTitle">Import trips</h2></div><button class="icon-button" value="cancel" aria-label="Close import">×</button></div><p class="muted">Choose a Glauco JSON trip file prepared from your Lambus Daily Plan.</p><label class="file-picker">Choose trip file<input id="importFile" type="file" accept="application/json,.json"></label><p id="importError" class="error" role="alert"></p><div id="importPreview"></div><div class="modal-actions"><button class="button ghost" value="cancel">Cancel</button><button id="confirmImport" class="button primary" type="button" disabled>Import</button></div></form></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><form method="dialog" class="dialog-inner"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="modal-actions"><button class="button ghost" value="cancel">Cancel</button><button class="button primary" value="confirm">Continue</button></div></form></dialog>
<dialog id="photoDialog" class="photo-dialog" aria-label="Photo viewer"><div class="photo-inner"><div class="photo-header"><button id="closePhoto" class="icon-button photo-close" aria-label="Close photo viewer">×</button></div><div class="photo-stage"><img id="largePhoto" alt=""></div><div id="photoNavigation" class="photo-navigation hidden"><button id="previousPhoto" class="icon-button photo-prev" aria-label="Previous photo">‹</button><button id="nextPhoto" class="icon-button photo-next" aria-label="Next photo">›</button></div></div></dialog>
<dialog id="glossaryDialog" class="glossary-dialog" aria-labelledby="glossaryTitle" aria-describedby="glossaryDefinition"><form method="dialog" class="dialog-inner"><div class="dialog-heading"><h2 id="glossaryTitle"></h2><button class="icon-button" value="close" aria-label="Close definition">×</button></div><p id="glossaryDefinition"></p></form></dialog>
</body></html>
